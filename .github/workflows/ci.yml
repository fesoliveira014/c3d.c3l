name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  C3C_VERSION: "0.8.3"
  SDL3_TAG: "release-3.4.16"
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache c3c
        uses: actions/cache@v4
        with:
          path: ~/tools/c3
          key: c3c-linux-${{ env.C3C_VERSION }}

      - name: Install c3c
        run: |
          if [ ! -x ~/tools/c3/c3c ]; then
            mkdir -p ~/tools
            curl -fsSL -o /tmp/c3.tar.gz \
              "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-linux.tar.gz"
            tar -xzf /tmp/c3.tar.gz -C ~/tools
          fi
          echo "$HOME/tools/c3" >> "$GITHUB_PATH"

      - name: Install shader and Vulkan tools
        run: |
          # Only Ubuntu packages are needed; unrelated runner repositories can fail independently.
          c3d_apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
          )
          sudo apt-get "${c3d_apt_options[@]}" update -q
          sudo apt-get "${c3d_apt_options[@]}" install -y glslang-tools libvulkan1 libgl1-mesa-dev cmake ninja-build

      # SDL3 is not packaged by Ubuntu 24.04, so it is built once and cached
      # against its tag. The install goes to the default prefix, which is what
      # lets the linker resolve SDL3 without link arguments. The build is a
      # console build: the runner has no X11 or Wayland development libraries
      # and CI never opens a window, so only the link surface matters. A
      # desktop build follows the README instead.
      - name: Cache SDL3
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: ~/tools/sdl3
          key: sdl3-linux-${{ env.SDL3_TAG }}

      - name: Build SDL3
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL3_TAG" https://github.com/libsdl-org/SDL /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/tools/sdl3" \
            -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build /tmp/SDL/build
          cmake --install /tmp/SDL/build

      - name: Install SDL3
        run: |
          sudo cp -a ~/tools/sdl3/lib/. /usr/local/lib/
          sudo cp -a ~/tools/sdl3/include/. /usr/local/include/
          sudo ldconfig

      # Keyed on the box3d submodule commit: the artifact is only stale when
      # the pin moves.
      - name: Resolve box3d pin
        id: box3d
        run: echo "sha=$(git rev-parse HEAD:lib/box3d.c3l)" >> "$GITHUB_OUTPUT"

      - name: Cache box3d
        id: cache-box3d
        uses: actions/cache@v4
        with:
          path: lib/box3d.c3l/linked-libs/linux-x64
          key: box3d-linux-${{ steps.box3d.outputs.sha }}

      - name: Build box3d
        if: steps.cache-box3d.outputs.cache-hit != 'true'
        run: |
          python3 scripts/build.py --init-deps \
            --skip-abi --skip-shaders --skip-build

      - name: Fetch VMA native archives
        run: python3 lib/gpu.c3l/scripts/fetch_vma_libs.py

      - name: Fetch ImGui native archives
        run: bash lib/c3imgui.c3l/fetch_linked_libs.sh v0.1.2

      # Every dependency is imported by exactly one c3d module; a hit here is a layering violation.
      - name: Check module boundaries
        run: |
          violations=$(
            grep -rn 'import gpu' src/c3d --include='*.c3' | grep -vE 'src/c3d/(render|shader|post|rt|gui)/' \
              | grep -vE 'src/c3d/platform/.*import gpu::surface'
            grep -rn 'import sdl' src/c3d --include='*.c3' | grep -v 'src/c3d/platform/'
            grep -rn 'import imgui' src/c3d --include='*.c3' | grep -v 'src/c3d/gui/'
            grep -rn 'import cg' src/c3d --include='*.c3' | grep -v 'src/c3d/geometry/'
            grep -rn 'import b3' src/c3d --include='*.c3' | grep -v 'src/c3d/physics/'
            grep -rn 'import gltf' src/c3d --include='*.c3' | grep -v 'src/c3d/asset/gltf/'
            grep -rn 'import ufbx' src/c3d --include='*.c3' | grep -v 'src/c3d/asset/fbx/'
            true
          )
          if [ -n "$violations" ]; then
            echo "$violations"
            exit 1
          fi

      - name: Build and test
        run: python3 scripts/build.py --test

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep canonical line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/tools/c3
            ~/tools/VulkanSDK
            ~/tools/VulkanRT
          key: win-tools-${{ env.C3C_VERSION }}-${{ env.VULKAN_SDK_VERSION }}

      - name: Install c3c
        run: |
          if [ ! -f ~/tools/c3/c3c.exe ]; then
            mkdir -p ~/tools
            curl -fsSL -o /tmp/c3.zip \
              "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-windows.zip"
            unzip -q /tmp/c3.zip -d ~/tools
          fi
          # fetch-sdk stores the MSVC link libraries under AppData; c3c looks beside its own binary.
          if [ ! -d ~/tools/c3/msvc_sdk ]; then
            echo Y | ~/tools/c3/c3c.exe fetch-sdk windows
            cp -r ~/AppData/Local/c3/msvc_sdk ~/tools/c3/msvc_sdk
          fi
          # build.py resolves tools from native Python, which needs Windows-form PATH entries.
          cygpath -w "$HOME/tools/c3" >> "$GITHUB_PATH"

      - name: Install Vulkan SDK
        run: |
          if [ ! -d ~/tools/VulkanSDK/Include ]; then
            curl -fsSL -o /tmp/vulkan-sdk.exe \
              "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/vulkan_sdk.exe"
            /tmp/vulkan-sdk.exe --root "$(cygpath -w "$HOME/tools/VulkanSDK")" \
              --accept-licenses --default-answer --confirm-command install
          fi
          cygpath -w "$HOME/tools/VulkanSDK/Bin" >> "$GITHUB_PATH"

      # Every c3d executable imports vulkan-1.dll at process start, the test binary included.
      - name: Install Vulkan runtime
        run: |
          if [ ! -f ~/tools/VulkanRT/x64/vulkan-1.dll ]; then
            curl -fsSL -o /tmp/vulkanrt.zip \
              "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/VulkanRT-X64-${VULKAN_SDK_VERSION}-Components.zip"
            mkdir -p ~/tools/VulkanRT/x64
            unzip -q -j /tmp/vulkanrt.zip -d ~/tools/VulkanRT/x64 "*/x64/vulkan-1.dll" \
              || unzip -q /tmp/vulkanrt.zip -d ~/tools/VulkanRT
            find ~/tools/VulkanRT -iname vulkan-1.dll
          fi
          cygpath -w "$(dirname "$(find ~/tools/VulkanRT -iname vulkan-1.dll | head -1)")" >> "$GITHUB_PATH"

      - name: Resolve box3d pin
        id: box3d
        run: echo "sha=$(git rev-parse HEAD:lib/box3d.c3l)" >> "$GITHUB_OUTPUT"

      - name: Cache box3d
        id: cache-box3d
        uses: actions/cache@v4
        with:
          path: lib/box3d.c3l/linked-libs/windows-x64
          key: box3d-windows-${{ steps.box3d.outputs.sha }}

      - name: Build box3d
        if: steps.cache-box3d.outputs.cache-hit != 'true'
        run: python scripts/build.py --init-deps --skip-abi --skip-shaders --skip-build

      - name: Fetch VMA native archives
        run: python lib/gpu.c3l/scripts/fetch_vma_libs.py

      - name: Fetch ImGui native archives
        run: bash lib/c3imgui.c3l/fetch_linked_libs.sh v0.1.2

      - name: Build and test
        run: python scripts/build.py --test
